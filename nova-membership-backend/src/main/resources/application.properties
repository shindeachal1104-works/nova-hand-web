spring.application.name=nova-membership-backend
server.port=8080

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nova_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart (profile photos are limited to 5 MB in code, songs to 20 MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

# Local profile photo storage
app.upload-dir=${UPLOAD_DIR:uploads/profile-photos}

# JWT - CHANGE THIS IN PRODUCTION
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-a-long-random-value-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# JSON date format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false


# CORS
# Default = the Vite/React dev server on ANY port (5173, 5174, 3000 ...). In production set CORS_ORIGINS to your real site,
# e.g. CORS_ORIGINS=https://your-site.com   (comma separated for more than one).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

# Members with these e-mails (comma separated) get the ADMIN role after they register / log in.
# They can upload songs and review volunteer applications.
app.admin.emails=${ADMIN_EMAILS:}